      if (!b || b.disabled || busy) return;
      const act = b.dataset.act;
      if (act === "done") toggle(false);
      else if (act === "play") player.playRange(...r.play);
      else if (act === "split") split(r.split);
      else cut(r[act]);
    };
  }

  function pickWord(k, e) {
    if (busy) return;
    if (e.shiftKey && anchor !== null) sel = [Math.min(anchor, k), Math.max(anchor, k)];
    else { anchor = k; sel = [k, k]; player.seek(tokens[k].start, false); }
    render();
  }

  function toggle(on) {
    editing = on;
    if (!on) anchor = sel = null;
    document.body.classList.toggle("editing", on);
    bar.hidden = !on;
    player.setPick(on ? pickWord : null);
    render();
  }
  btn.onclick = () => toggle(!editing);

  doc.addEventListener("mousedown", e => { if (editing && e.shiftKey) e.preventDefault(); }); // no native shift-select
  doc.addEventListener("mouseup", () => { // a drag across the text picks the words it covers
    const s = getSelection();
    if (!editing || busy || s.isCollapsed) return;
    const ks = els.filter(el => s.containsNode(el, true)).map(el => +el.dataset.k);
    s.removeAllRanges();
    if (ks.length) { anchor = ks[0]; sel = [ks[0], ks[ks.length - 1]]; render(); }
  });

  async function run(label, call) {
    busy = true;
    bar.querySelectorAll("button").forEach(b => { b.disabled = true; });
    bar.querySelector(".what").textContent = `${label} — A MINUTE OR SO FOR A LONG RECORDING`;
    try { await call(); }
    catch (err) { alert(err.message); busy = false; render(); }
  }

  function cut([a, b]) {
    const said = plural(count(a, b), "word");
    const what = a <= 50 ? `Cut the first ${clock(b)} (${said}) off ${title}?\n\nThe recording will start at what is now ${clock(b)}.`
      : b >= durMs - 50 ? `Cut everything after ${clock(a)} (${clock(durMs - a)}, ${said}) off ${title}?`
      : `Cut ${clock(a)} – ${clock(b)} (${clock(b - a)}, ${said}) out of ${title}?\n\n`
        + `The audio there is erased from every file of this recording (the mix, the denoised copy${item.tracks ? " and each mic's own file" : ""}) `
        + "and playback skips the gap; the timecodes after it stay as they are.";
    if (!confirm(`${what}\n\nThose words leave the transcript and the clean-up; nothing is transcribed again. ${kept}`)) return;
    run("CUTTING", async () => {
      await api(`/api/item/${item.id}/cut`, { method: "POST", body: JSON.stringify({ start_ms: Math.round(a), end_ms: Math.round(b) }) });
      showRecording(item.id);
    });
  }

  function split(at) {
    if (!confirm(`Split ${title} in two at ${clock(at)}?\n\n`
      + `Part 1: 0:00 – ${clock(at)} (${plural(count(0, at), "word")})\nPart 2: ${clock(at)} – ${clock(durMs)} (${plural(count(at, durMs), "word")})\n\n`
      + `Each part gets its share of the audio${item.tracks ? ", of each mic's file" : ""} and of the transcript, keeps the folder, flags, `
      + `notes and speaker names, and gets its own title from Claude. Nothing is transcribed again. ${kept}`)) return;
    run("SPLITTING", async () => {
      await api(`/api/item/${item.id}/split`, { method: "POST", body: JSON.stringify({ at_ms: at }) });
      location.hash = "#/";
    });
  }
}

/* ---------------------------------------------------------- clean-up prompt */

// Opens the prompt editor; resolves {saved, reclean} once the dialog closes.
// Three tiers: the built-in prompt (in transcribe.py), the user's own default
// (clean_prompt_default.txt), and the active prompt (clean_prompt.txt).
// The dialog lives on <body>, so re-rendering the transcript underneath is safe.
async function editCleanPrompt(item) {
  let cur = await api("/api/clean-prompt");
  const canReclean = item && item.status === "ready" && item.clean_status !== "working";
  const dlg = document.createElement("dialog");
  dlg.className = "prompt-dlg";
  dlg.innerHTML = `<form method="dialog">
    <div class="prompt-head"><b>CLEAN-UP PROMPT</b><span class="prompt-status" id="p-status"></span></div>
    <div class="prompt-note">Sent to Claude as the system prompt with every chunk of transcript, for all recordings.
      <b>SAVE</b> uses it from the next clean-up on. <b>SAVE AS DEFAULT</b> also makes it your baseline — what
      <b>RESET TO DEFAULT</b> restores; <b>BUILT-IN</b> brings back the prompt that ships with Reel. The reply
      format is enforced separately, so rewrite the rules freely. Stored as <code>clean_prompt.txt</code> and
      <code>clean_prompt_default.txt</code>. ⌘↩ saves · esc closes.</div>
    <textarea id="p-text" spellcheck="false" aria-label="Clean-up prompt"></textarea>
    <div class="prompt-foot">
      <button type="button" id="p-reset" title="Load your default prompt into the editor">RESET TO DEFAULT</button>
      <button type="button" id="p-builtin" title="Load the prompt that ships with Reel into the editor">BUILT-IN</button>
      <span class="spacer"></span>
      <button type="button" id="p-cancel">CANCEL</button>
      <button type="button" id="p-default" title="Use this prompt and make it what RESET TO DEFAULT returns to">SAVE AS DEFAULT</button>
      <button type="button" id="p-save" title="Use this prompt for clean-ups from now on">SAVE</button>
      ${canReclean ? `<button type="button" class="primary" id="p-run" title="Save, then run the clean-up again on this recording (uses API credit)">SAVE &amp; RE-CLEAN</button>` : ""}
    </div></form>`;
  document.body.appendChild(dlg);

  const $ = id => dlg.querySelector("#" + id);
  const ta = $("p-text"), status = $("p-status");
  const reset = $("p-reset"), builtin = $("p-builtin"), save = $("p-save");
  const asDefault = $("p-default"), run = $("p-run");
  ta.value = cur.prompt;

  const norm = t => t.replace(/\r\n/g, "\n").trim();
  const same = (a, b) => norm(a) === norm(b);
  const isBuiltin = () => same(ta.value, cur.builtin);
  const isDefault = () => same(ta.value, cur.default);
  const dirty = () => !same(ta.value, cur.prompt);
  const refresh = () => {
    const tier = isBuiltin() ? "BUILT-IN" : isDefault() ? "DEFAULT" : "CUSTOM";
    status.innerHTML = tier + (dirty() ? ' <span class="unsaved">· UNSAVED</span>' : "");
    status.classList.toggle("custom", tier === "CUSTOM");
    reset.disabled = isDefault();
    builtin.hidden = same(cur.default, cur.builtin); // then RESET TO DEFAULT already does it
    builtin.disabled = isBuiltin();
    asDefault.disabled = isDefault();
    save.disabled = !dirty();
  };
  ta.addEventListener("input", refresh);
  refresh();

  // Save the editor text; asDef also promotes it to the default. Resolves to
  // whether the dialog may close.
  const persist = async asDef => {
    if (!asDef && !dirty()) return true;
    const btn = asDef ? asDefault : save, label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "SAVING…";
    try {
      cur = await api("/api/clean-prompt", {
        method: "POST", body: JSON.stringify({ prompt: ta.value, as_default: asDef }),
      });
      ta.value = cur.prompt; // server normalises whitespace
      return true;
    } catch (err) {
      alert("Couldn't save the prompt: " + err.message);
      return false;
    } finally {
      btn.textContent = label;
      refresh();
    }
  };

  return new Promise(resolve => {
    let outcome = { saved: false, reclean: false };
    const finish = o => { outcome = { ...outcome, ...o }; dlg.close(); };
    const tryClose = () => { // Escape / CANCEL ask first when there are unsaved edits
      if (dirty() && !confirm("Discard your changes to the prompt?")) return;
      dlg.close();
    };
    const load = text => { ta.value = text; refresh(); ta.focus(); };
    reset.onclick = () => load(cur.default);
    builtin.onclick = () => load(cur.builtin);
    $("p-cancel").onclick = tryClose;
    save.onclick = async () => { if (await persist(false)) finish({ saved: true }); };
    asDefault.onclick = async () => { if (await persist(true)) finish({ saved: true }); };
    if (run) run.onclick = async () => { if (await persist(false)) finish({ saved: true, reclean: true }); };
    ta.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); save.click(); }
    });
    dlg.addEventListener("cancel", e => { e.preventDefault(); tryClose(); });
    dlg.addEventListener("close", () => { dlg.remove(); resolve(outcome); });
    dlg.showModal();
    ta.focus();
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
  });
}

/* ---------------------------------------------------------------- settings */

// ⚙ SETTINGS: the API keys (kept in .env), the Google Drive backup and how new
// recordings start out (settings.json, on this Mac). Everything saves as it changes.
const KEY_INFO = {
  elevenlabs: { name: "ELEVENLABS", what: `Needed to transcribe. Make one at <a href="https://elevenlabs.io" target="_blank" rel="noopener">elevenlabs.io</a>
    (Developers → API keys) — and before your first recording, opt out of training: Terms and Privacy → Data use.` },
  anthropic: { name: "ANTHROPIC", what: `Optional: titles and the filler clean-up, by Claude. Make one at
    <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a> (API keys).` },
};

async function editSettings() {
  let cur = await api("/api/settings");
  const home = p => String(p).replace(/^\/Users\/[^/]+/, "~");
  const dlg = document.createElement("dialog");
  dlg.className = "prompt-dlg";
  document.body.appendChild(dlg);

  const keyRow = k => {
    const s = cur.keys[k], info = KEY_INFO[k];
    const have = !s.set ? "NOT SET" : "SET" + (s.hint ? ` · …${esc(s.hint)}` : "")
      + (s.from === "environment" ? " · FROM YOUR SHELL'S ENVIRONMENT, WHICH WINS: CHANGE IT THERE" : "");
    return `<div class="key-row">
      <b>${info.name}</b>
      <input type="password" data-key="${k}" autocomplete="off" spellcheck="false" aria-label="${info.name} API key"
        placeholder="${s.set ? "paste a new key to replace it" : "paste your key here"}" ${s.from === "environment" ? "disabled" : ""}>
      <button type="button" class="small" data-save-key="${k}" disabled>SAVE</button>
      <div class="note" data-key-note="${k}">${have} — ${info.what}</div>
    </div>`;
  };
  const backupStatus = () => {
    const b = cur.backup_status || {};
    if (b.running) return ["BACKING UP…", ""];
    if (b.error && cur.backup) return [b.error, "bad"];
    if (b.last) return [`LAST BACKED UP ${new Date(b.last * 1000).toLocaleString()}`
      + (b.copied != null ? ` · ${b.copied} FILE${b.copied === 1 ? "" : "S"} COPIED THAT TIME` : ""), ""];
    return [cur.backup ? "STARTING…" : "", ""];
  };
  const render = () => {
    const folders = [...new Set([...(cur.drive_folders || []), ...(cur.backup_dir ? [cur.backup_dir] : [])])];
    const [status, cls] = backupStatus();
    dlg.innerHTML = `<form method="dialog">
      <div class="prompt-head"><b>SETTINGS</b><span class="prompt-status">THIS MAC</span></div>
      <div class="settings">
        <h3>API KEYS</h3>
        ${keyRow("elevenlabs")}
        ${keyRow("anthropic")}
        <div class="note">Kept in <code>.env</code> next to <code>transcribe.py</code>, readable only by you. Audio goes to
          ElevenLabs to be transcribed (their copy of the transcript is deleted once it's saved here), transcript text to
          Anthropic for titles and the clean-up.</div>
        <h3>GOOGLE DRIVE BACKUP</h3>
        <label><input type="checkbox" data-setting="backup" ${cur.backup ? "checked" : ""}> BACK UP TO GOOGLE DRIVE
          <span>Copies each recording — transcript, clean-up and audio — into <code>Reel backup/</code> in your Drive,
          through Google Drive for desktop: every 15 minutes while Reel runs, and soon after each new recording.
          Nothing in the backup is ever deleted.</span></label>
        ${(cur.drive_folders || []).length || cur.backup_dir ? "" : `<div class="note bad">No Google Drive on this Mac yet: install
          <a href="${esc(cur.drive_download)}" target="_blank" rel="noopener">Google Drive for desktop</a> and sign in,
          then open the settings again. Or back up to any other folder (an external disk, say).</div>`}
        <div class="backup-where"><b>FOLDER</b>
          <select id="b-dir" aria-label="Backup folder">
            ${folders.map(p => `<option value="${esc(p)}" ${p === cur.backup_dir ? "selected" : ""}>${esc(home(p))}</option>`).join("")}
            ${folders.length ? "" : '<option value="" selected>—</option>'}
            <option value="__other__">other folder…</option></select>
          <button type="button" class="small" id="b-now" ${cur.backup ? "" : "disabled"}>BACK UP NOW</button>
          <div class="note ${cls}" id="b-status">${esc(status)}</div>
        </div>
        <label><input type="checkbox" data-setting="backup_tracks" ${cur.backup_tracks ? "checked" : ""}> INCLUDE EACH MIC'S OWN FILES
          <span>For multi-mic recordings, the recorders' original files too, so a restored recording can still be
          re-mixed, combined or given another mic. Large: often ten times everything else.</span></label>
        <h3>RECORDERS PLUGGED IN BY USB</h3>
        <label><input type="checkbox" data-setting="clear_mic" ${cur.clear_mic ? "checked" : ""}> CLEAR THE MIC AFTER COPYING
          <span>Reel copies a plugged-in recorder's new recordings (DJI Mic transmitters, SD cards) into the inbox.
          With this on, it then deletes them from the recorder — each one only once Reel holds a byte-identical copy
          (checked by SHA-256) — so the mic never fills up. Off, they stay on the recorder. From the next time one is
          plugged in.</span></label>
        <h3>NEW RECORDINGS</h3>
        <label><input type="checkbox" data-setting="no_training" ${cur.no_training ? "checked" : ""}> NOT FOR TRAINING BY DEFAULT
          <span>Recorded here, added, or from the inbox. ASK FIRST reads <code>${esc(DEFAULT_NOTE)}</code> until someone
          writes the real reason; untick it on any recording as usual.</span></label>
        <div class="note">Your recordings are in <code>${esc(home(cur.data))}</code>.</div>
      </div>
      <div class="prompt-foot"><span class="spacer"></span><button type="button" class="primary" id="s-done">DONE</button></div>
    </form>`;
    wire();
  };
  const saveSetting = async body => {
    try {
      cur = await api("/api/settings", { method: "POST", body: JSON.stringify(body) });
    } catch (err) { alert("Couldn't save the setting: " + err.message); }
    render();
  };
  const wire = () => {
    dlg.querySelectorAll("[data-key]").forEach(input => {
      const k = input.dataset.key, btn = dlg.querySelector(`[data-save-key="${k}"]`);
      const note = dlg.querySelector(`[data-key-note="${k}"]`);
      input.oninput = () => { btn.disabled = !input.value.trim(); };
      input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (!btn.disabled) btn.click(); } };
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = "CHECKING…";
        try {
          const res = await api("/api/keys", { method: "POST", body: JSON.stringify({ service: k, key: input.value }) });
          cur = res;
          render();
          const n = dlg.querySelector(`[data-key-note="${k}"]`);
          n.classList.add("ok");
          n.textContent = res.check === "ok" ? `SAVED ✓ — ${KEY_INFO[k].name} ACCEPTED IT`
            : "SAVED — it couldn't be checked just now (offline?, or a key limited to fewer permissions); it's used from the next request on.";
        } catch (err) {
          note.classList.add("bad"); note.textContent = err.message;
          btn.disabled = false; btn.textContent = "SAVE";
        }
      };
    });
    dlg.querySelectorAll("[data-setting]").forEach(box => {
      box.onchange = () => {
        if (box.dataset.setting === "clear_mic" && box.checked && !confirm("Delete recordings from a plugged-in "
          + "recorder once Reel has copied them?\n\nEach file is deleted only after Reel has checked that its own copy "
          + "is identical, byte for byte. Until then, and for anything it can't verify, the recorder keeps its files.")) {
          box.checked = false;
          return;
        }
        saveSetting({ [box.dataset.setting]: box.checked });
      };
    });
    const dir = dlg.querySelector("#b-dir");
    dir.onchange = () => {
      if (dir.value !== "__other__") return saveSetting({ backup_dir: dir.value });
      const path = (prompt("Folder to back up to (its full path, e.g. /Volumes/Backup):", cur.backup_dir || "") || "").trim();
      if (path) saveSetting({ backup_dir: path }); else render();
    };
    dlg.querySelector("#b-now").onclick = async () => {
      try { cur = await api("/api/backup", { method: "POST" }); } catch (err) { alert(err.message); }
      render();
    };
    dlg.querySelector("#s-done").onclick = () => dlg.close();
  };
  const poll = setInterval(async () => { // keep the backup's status current while the dialog is open
    try {
      const st = await api("/api/settings");
      cur.backup_status = st.backup_status;
      const el = dlg.querySelector("#b-status"), [text, cls] = backupStatus();
      if (el) { el.textContent = text; el.className = "note " + cls; }
    } catch (err) { /* the next tick tries again */ }
  }, 2000);
  render();
  dlg.addEventListener("close", () => {
    clearInterval(poll);
    dlg.remove();
    if (!location.hash || location.hash === "#/") showLibrary();
  });
  dlg.showModal();
}

/* ---------------------------------------------------------------- key terms */

// Opens the key-terms editor (keyterms.txt); resolves {saved, reclean} once closed.
async function editKeyterms(item) {
  let cur = await api("/api/keyterms");
  const canReclean = item && item.status === "ready" && item.clean_status !== "working";
  const dlg = document.createElement("dialog");
  dlg.className = "prompt-dlg";
  dlg.innerHTML = `<form method="dialog">
    <div class="prompt-head"><b>KEY TERMS</b><span class="prompt-status" id="t-status"></span></div>
    <div class="prompt-note">Names and jargon in your recordings, one per line, optionally with an explanation in
      brackets: <code>ASR (automatic speech recognition)</code>. ElevenLabs listens for each term and its
      explanation (up to 5 words, under 50 characters each) from the next transcription on; Claude's clean-up gets the
      whole list to fix mis-heard words. Lines starting with # are notes. Stored as <code>keyterms.txt</code>
      (on this Mac). ⌘↩ saves · esc closes.</div>
    <textarea id="t-text" spellcheck="false" aria-label="Key terms"></textarea>
    <div class="prompt-foot">
      <span class="prompt-status" id="t-skipped"></span>
      <span class="spacer"></span>
      <button type="button" id="t-cancel">CANCEL</button>
      <button type="button" id="t-save" title="Use these terms from the next transcription and clean-up on">SAVE</button>
      ${canReclean ? `<button type="button" class="primary" id="t-run" title="Save, then run the clean-up again on this recording (uses API credit)">SAVE &amp; RE-CLEAN</button>` : ""}
    </div></form>`;
  document.body.appendChild(dlg);

  const $ = id => dlg.querySelector("#" + id);
  const ta = $("t-text"), status = $("t-status"), skipped = $("t-skipped"), save = $("t-save"), run = $("t-run");
  ta.value = cur.text;
  const norm = t => t.replace(/\r\n/g, "\n").trimEnd();
  const dirty = () => norm(ta.value) !== norm(cur.text);
  const refresh = () => {
    status.innerHTML = `${cur.terms} TERM${cur.terms === 1 ? "" : "S"} · ${cur.scribe} SENT TO ELEVENLABS`
      + (dirty() ? ' <span class="unsaved">· UNSAVED</span>' : "");
    skipped.textContent = cur.skipped.length ? `TOO LONG FOR ELEVENLABS (CLAUDE STILL GETS THEM): ${cur.skipped.join(", ")}` : "";
    save.disabled = !dirty();
  };
  ta.addEventListener("input", refresh);
  refresh();

  const persist = async () => {
    if (!dirty()) return true;
    const label = save.textContent;
    save.disabled = true;
    save.textContent = "SAVING…";
    try {
      cur = await api("/api/keyterms", { method: "POST", body: JSON.stringify({ text: ta.value }) });
      ta.value = cur.text;
      return true;
    } catch (err) {
      alert("Couldn't save the key terms: " + err.message);
      return false;
    } finally {
      save.textContent = label;
      refresh();
    }
  };

  return new Promise(resolve => {
    let outcome = { saved: false, reclean: false };
    const finish = o => { outcome = { ...outcome, ...o }; dlg.close(); };
    const tryClose = () => {
      if (dirty() && !confirm("Discard your changes to the key terms?")) return;
      dlg.close();
    };
    $("t-cancel").onclick = tryClose;
    save.onclick = async () => { if (await persist()) finish({ saved: true }); };
    if (run) run.onclick = async () => { if (await persist()) finish({ saved: true, reclean: true }); };
    ta.addEventListener("keydown", e => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); (dirty() ? save : $("t-cancel")).click(); }
    });
    dlg.addEventListener("cancel", e => { e.preventDefault(); tryClose(); });
    dlg.addEventListener("close", () => { dlg.remove(); resolve(outcome); });
    dlg.showModal();
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.scrollTop = ta.scrollHeight;
  });
}

function makePlayer(item, transcript, tokens) {
  const audio = document.getElementById("audio");
  const mixUrl = () => (item.denoise === "ready" && denoiseOn()) ? `/audio/${item.id}?src=denoised` : `/audio/${item.id}`;
  const playBtn = document.getElementById("play");
  const rateBtn = document.getElementById("rate");
  const followBtn = document.getElementById("follow");
  const recdot = document.getElementById("recdot");
  const cur = document.getElementById("cur");
  const fill = document.getElementById("fill");
  const doc = document.getElementById("doc");
  const rates = [1, 1.25, 1.5, 1.75, 2];

  let follow = true;
  let activeIdx = -1;
  let raf = 0;
  let destroyed = false;
  let stopAt = null; // ms: pause there (playing a picked stretch)
  let pick = null;   // while cutting/splitting: a word click picks the word instead of playing it
  const cuts = item.cuts || [];
  const fmtRate = r => r.toFixed(2).replace(/0$/, "").replace(/\.0$/, ".0") + "×";

  // Multi-mic: the transcript lives on the mix's timeline. When a raw recorder
  // file is playing instead, map between its own clock and the mix's:
  // file_time = offset + mix_time · (1 + drift).
  let srcTrack = -1; // -1 = the mix
  const trk = () => item.tracks[srcTrack];
  const toMix = s => srcTrack < 0 ? s : (s - trk().offset) / (1 + (trk().drift || 0));
  const fromMix = s => srcTrack < 0 ? s : trk().offset + s * (1 + (trk().drift || 0));
  const nowMs = () => toMix(audio.currentTime) * 1000;

  const durMs = () => (srcTrack < 0 && audio.duration ? audio.duration * 1000
    : transcript.audio_duration_ms || item.duration_ms || 0);

  // Greatest display token whose start <= t; -1 if before the first one.
  function findToken(t) {
    let lo = 0, hi = tokens.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (tokens[mid].start <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  function keepInView(el) {
    const r = el.getBoundingClientRect();
    const vh = window.innerHeight;
    if (r.top < vh * 0.22 || r.bottom > vh * 0.72) {
      window.scrollTo({
        top: window.scrollY + r.top - vh * 0.4,
        behavior: motionOK ? "smooth" : "auto",
      });
    }
  }

  // Remember the listening position per recording.
  const posKey = "reel-pos-" + item.id;
  let lastSavedPos = 0;
  const savePos = () => {
    const t = toMix(audio.currentTime);
    if (Math.abs(t - lastSavedPos) < 2) return;
    lastSavedPos = t;
    localStorage.setItem(posKey, String(t));
  };

  function tick() {
    let t = nowMs();
    const cut = cuts.find(([a, b]) => t >= a && t < b - 20);
    if (cut) { audio.currentTime = fromMix(cut[1] / 1000); t = cut[1]; } // silent: skip it
    if (stopAt !== null && t >= stopAt) { stopAt = null; audio.pause(); }
    cur.textContent = clock(t);
    savePos();
    const d = durMs();
    fill.style.width = d ? Math.min(100, t / d * 100) + "%" : "0";
    const k = findToken(t);
    if (k !== activeIdx) {
      const prev = doc.querySelector(".w.active");
      if (prev) prev.classList.remove("active");
      activeIdx = k;
      if (k >= 0) {
        const el = doc.querySelector(`.w[data-k="${k}"]`);
        if (el) {
          el.classList.add("active");
          if (follow && !audio.paused) keepInView(el);
        }
      }
    }
  }

  function loop() {
    if (destroyed || audio.paused) return;
    tick();
    raf = requestAnimationFrame(loop);
  }

  function seek(ms, andPlay) {
    stopAt = null;
    audio.currentTime = fromMix(ms / 1000);
    if (andPlay && audio.paused) audio.play();
    tick();
  }

  // Switch between the mix and a single recorder's file, keeping the position.
  const srcSeg = document.getElementById("src");
  function switchSource(i, atMix) {
    if (i === srcTrack) return;
    const wasPlaying = !audio.paused;
    const tMix = atMix != null ? atMix : toMix(audio.currentTime);
    srcTrack = i;
    srcSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.src === i));
    audio.src = i < 0 ? mixUrl() : `/audio/${item.id}?track=${i}`;
    audio.addEventListener("loadedmetadata", () => {
      audio.currentTime = Math.max(0, fromMix(tMix));
      if (wasPlaying) audio.play();
      tick();
    }, { once: true });
    audio.load();
  }
  const placeSel = document.getElementById("place-group");
  const trainBox = document.getElementById("no-training");
  const noteIn = key => document.querySelector(`.place [data-note="${key}"]`);
  // Show the folder, the box and its note as the server now has them.
  const showPlace = () => {
    placeSel.innerHTML = groupOptions(item.group);
    trainBox.checked = !!item.no_training; trainBox.parentElement.classList.toggle("on", !!item.no_training);
    for (const [key, shown] of [["training_ask", item.no_training]]) {
      noteIn(key).value = item[key] || ""; noteIn(key).parentElement.hidden = !shown;
      noteIn(key).classList.toggle("dflt", item[key] === DEFAULT_NOTE);
    }
  };
  const update = async call => {
    try {
      const res = await call();
      for (const k of ["group", "no_training", "training_ask"]) item[k] = res[k];
    } catch (err) { alert(err.message); }
    showPlace();
  };
  if (placeSel) {
    placeSel.onchange = () => {
      let g = placeSel.value;
      if (g === "__new__") { g = askNewFolder(); if (!g) { placeSel.value = item.group; return; } }
      update(() => placeItem(item.id, g));
    };
    trainBox.onchange = () => update(() => setFlags(item.id, { no_training: trainBox.checked }));
    for (const key of Object.keys(NOTES)) {
      const box = noteIn(key);
      box.onchange = () => update(() => setFlags(item.id, { [key]: box.value }));
      box.onkeydown = e => { if (e.key === "Enter") box.blur(); };
    }
  }
  const dnBtn = document.getElementById("denoise");
  if (dnBtn) dnBtn.onclick = () => {
    localStorage.setItem("reel-denoise", denoiseOn() ? "off" : "on");
    dnBtn.classList.toggle("on", denoiseOn());
    if (srcTrack < 0) { const t = audio.currentTime; srcTrack = -2; switchSource(-1, toMix(t)); }
  };
  if (srcSeg) {
    srcSeg.querySelectorAll("button").forEach(b => { b.onclick = () => switchSource(+b.dataset.src); });
    audio.addEventListener("error", () => {
      if (srcTrack < 0) return;
      const b = srcSeg.querySelector(`button[data-src="${srcTrack}"]`);
      if (b) { b.classList.add("src-bad"); b.title = "This browser can't play the raw file (try the mix)"; }
      switchSource(-1);
    });
  }

  audio.addEventListener("play", () => {
    playBtn.textContent = "PAUSE";
    recdot.classList.add("on");
    loop();
  });
  audio.addEventListener("pause", () => {
    playBtn.textContent = "PLAY";
    recdot.classList.remove("on");
    cancelAnimationFrame(raf);
    lastSavedPos = -10; // force a save through the throttle
    tick();
  });
  audio.addEventListener("ended", () => localStorage.removeItem(posKey));
  audio.addEventListener("seeked", tick);
  audio.addEventListener("loadedmetadata", tick);

  const rememberedPos = parseFloat(localStorage.getItem(posKey) || "0");
  if (rememberedPos > 5) {
    const resumeAt = () => {
      if (!audio.duration || rememberedPos < audio.duration - 5) {
        audio.currentTime = fromMix(rememberedPos);
        tick();
        const el = doc.querySelector(".w.active");
        if (el) keepInView(el);
      }
    };
    if (audio.readyState >= 1) resumeAt();
    else audio.addEventListener("loadedmetadata", resumeAt, { once: true });
  }

  playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
  rateBtn.onclick = () => {
    const next = rates[(rates.indexOf(audio.playbackRate) + 1) % rates.length] || 1;
    audio.playbackRate = next;
    rateBtn.textContent = fmtRate(next);
  };

  document.getElementById("bar").onclick = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    seek((e.clientX - rect.left) / rect.width * durMs(), false);
  };

  const spkName = s => (item.speaker_names || {})[s] || prettySpk(s);

  async function renameSpeaker(id) {
    const name = prompt(`Name for ${prettySpk(id)}:`, (item.speaker_names || {})[id] || "");
    if (name === null) return;
    const names = { ...(item.speaker_names || {}) };
    if (name.trim()) names[id] = name.trim(); else delete names[id];
    const res = await api(`/api/item/${item.id}/speakers`, {
      method: "POST", body: JSON.stringify({ names }),
    });
    item.speaker_names = res.item.speaker_names;
    doc.querySelectorAll(`.spk[data-spk="${CSS.escape(id)}"]`)
      .forEach(el => { el.textContent = spkName(id); });
  }

  doc.addEventListener("click", e => {
    const w = e.target.closest(".w");
    const tc = e.target.closest(".tc-btn");
    const sp = e.target.closest(".spk");
    if (w && pick) pick(+w.dataset.k, e);
    else if (w) { follow = true; followBtn.hidden = true; seek(tokens[+w.dataset.k].start, true); }
    else if (tc) { follow = true; followBtn.hidden = true; seek(+tc.dataset.t, true); }
    else if (sp) renameSpeaker(sp.dataset.spk).catch(err => alert(err.message));
  });

  const plainText = () => {
    let tk = 0;
    return buildSections(transcript).map(sec => {
      const lastIdx = sec.idx[sec.idx.length - 1];
      const mine = [];
      while (tk < tokens.length && tokens[tk].i <= lastIdx) mine.push(tokens[tk++]);
      if (!mine.length) return null;
      const text = withPauses(transcript.words, mine).map(({ t, pause }) => (pause ? "… " : "") + t.text).join(" ");
      if (sec.cont) return text;
      return (sec.speaker ? `${spkName(sec.speaker)} [${clock(sec.start)}]:\n` : `[${clock(sec.start)}]\n`) + text;
    }).filter(Boolean).join("\n\n");
  };

  document.getElementById("copy").onclick = async e => {
    await navigator.clipboard.writeText(plainText());
    e.target.textContent = "COPIED ✓";
    setTimeout(() => { e.target.textContent = "COPY TEXT"; }, 1600);
  };
  document.getElementById("download").onclick = () => {
    const url = URL.createObjectURL(new Blob([plainText()], { type: "text/plain" }));
    const a = Object.assign(document.createElement("a"), {
      href: url, download: dispTitle(item).replace(/\.[^.]+$/, "") + ".txt",
    });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000); // Safari drops the download if it's revoked at once
  };

  const userScrolled = () => {
    if (follow && !audio.paused) { follow = false; followBtn.hidden = false; }
  };
  window.addEventListener("wheel", userScrolled, { passive: true });
  window.addEventListener("touchmove", userScrolled, { passive: true });
  followBtn.onclick = () => {
    follow = true;
    followBtn.hidden = true;
    const el = doc.querySelector(".w.active");
    if (el) keepInView(el);
  };

  const onKey = e => {
    if (e.target.matches("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); seek(Math.max(0, nowMs() - 5000), false); }
    else if (e.key === "ArrowRight") { e.preventDefault(); seek(nowMs() + 5000, false); }
  };
  document.addEventListener("keydown", onKey);

  tick();
  return {
    seek,
    playRange(a, b) { follow = true; followBtn.hidden = true; seek(a, true); stopAt = b; },
    setPick(fn) { pick = fn; },
    snapshot() {
      return { t: toMix(audio.currentTime), paused: audio.paused, rate: audio.playbackRate, src: srcTrack };
    },
    restore(st) {
      const apply = () => {
        if (st.src != null && st.src !== srcTrack && srcSeg) {
          audio.playbackRate = st.rate;
          rateBtn.textContent = fmtRate(st.rate);
          if (!st.paused) audio.play().catch(() => {});
          switchSource(st.src, st.t);
          return;
        }
        audio.currentTime = fromMix(st.t);
        audio.playbackRate = st.rate;
        rateBtn.textContent = fmtRate(st.rate);
        if (!st.paused) audio.play();
        tick();
      };
      if (audio.readyState >= 1) apply();
      else audio.addEventListener("loadedmetadata", apply, { once: true });
    },
    destroy() {
      destroyed = true;
      cancelAnimationFrame(raf);
      audio.pause();
      document.removeEventListener("keydown", onKey);
      window.removeEventListener("wheel", userScrolled);
      window.removeEventListener("touchmove", userScrolled);
    },
  };
}

route();
</script>
